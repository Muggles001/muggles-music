apply plugin: 'com.android.application'

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("signing.properties")
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def signingValue = { String propertyName, String environmentName ->
    signingProperties.getProperty(propertyName) ?: System.getenv(environmentName) ?: ""
}

android {
    namespace = "top.boluofan.musictv"
    compileSdk = 36
    defaultConfig {
        applicationId "io.github.muggles001.mugglesmusic"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 30
        versionName "2.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            lintOptions {
                abortOnError true
            }
        }
        release {
            signingConfigs {
                release {
                    storeFile file(signingProperties.getProperty("storeFile", "release-keystore.jks"))
                    storePassword signingValue("storePassword", "KEYSTORE_PASSWORD")
                    keyAlias signingValue("keyAlias", "KEYSTORE_ALIAS")
                    keyPassword signingValue("keyPassword", "KEYSTORE_ALIAS_PASSWORD")
                }
            }
            minifyEnabled false
            lintOptions {
                abortOnError true
            }
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // Native Dependencies
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.0'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // ExoPlayer (Media3)
    implementation "androidx.media3:media3-exoplayer:1.2.0"
    implementation "androidx.media3:media3-common:1.2.0"
    implementation "androidx.media3:media3-session:1.2.0"
    implementation "androidx.cardview:cardview:1.0.0"
    // Web Server for Remote Login
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // QR Code Generation
    implementation 'com.google.zxing:core:3.5.3'
    // LX-compatible custom source scripts run in the same lightweight engine used by LX Music Mobile.
    implementation 'wang.harlon.quickjs:wrapper-android:2.4.0'

    implementation 'androidx.room:room-runtime:2.7.2'
    annotationProcessor 'androidx.room:room-compiler:2.7.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}


try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
